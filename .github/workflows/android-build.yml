name: Android build and unit tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          yes | sdkmanager --licenses

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Run JVM and Robolectric tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
