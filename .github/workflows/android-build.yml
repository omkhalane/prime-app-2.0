name: Android build and unit tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel an active Android build just because another commit was pushed.
  cancel-in-progress: false

jobs:
  android:
    name: Compile debug APK and run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          # sdkmanager closes stdin after accepting all licenses. Ignore the
          # resulting SIGPIPE from "yes", but preserve sdkmanager's exit code.
          set +e
          yes 2>/dev/null | sdkmanager --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload debug APK for device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: prime-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Run JVM and Robolectric tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run Android lint
        run: gradle --no-daemon :app:lintDebug --stacktrace
