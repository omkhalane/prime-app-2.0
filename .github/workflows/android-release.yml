name: Build and publish PRIME Android release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: prime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-36.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          set +e
          yes 2>/dev/null | sdkmanager --licenses
          sdkmanager_status=${PIPESTATUS[1]}
          set -e
          exit "$sdkmanager_status"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure release signing key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure UPLOAD_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD in repository Actions secrets before creating a release tag."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prime-upload-key.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/prime-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          chmod 600 "$RUNNER_TEMP/prime-upload-key.jks"

      - name: Verify release signing configuration
        run: |
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias upload >/dev/null

      - name: Run unit tests, release lint, and build signed APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Verify APK output
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" "PRIME-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: PRIME ${{ github.ref_name }}
          files: PRIME-${{ github.ref_name }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
